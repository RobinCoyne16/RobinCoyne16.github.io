<!DOCTYPE html>

<title>Coyne Family Brain</title>
<style>

#st{position:sticky;top:0;min-height:1.4em;font-size:.9rem;color:var(--ok)}
.chk:focus-within{outline:3px solid var(--ac)}.ts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:560px){.ts{grid-template-columns:repeat(4,1fr)}}.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}.st b{display:block;font-size:1.6rem;line-height:1.1}.st span{color:var(--mu);font-size:.85rem}.tk{display:flex;align-items:center;gap:8px;min-height:52px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;padding:6px 10px;margin:6px 0}.tk.p1{border-left-color:#d6402f}.tk.p2{border-left-color:#e49a1a}.tk.done{opacity:.55}.tk.done .tt{text-decoration:line-through}.tk input[type=checkbox]{width:22px;height:22px}.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.8rem;color:var(--mu)}.wk b{display:block;color:var(--tx);font-size:1.15rem}.tb{display:grid;grid-template-columns:80px 1fr 24px;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}.tr{height:10px;background:var(--ac2);border-radius:5px;overflow:hidden}.tr i{display:block;height:100%;background:var(--ac)}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body><main>
<div class="bar"><h1>Coyne Family Brain</h1><span class="sp"></span><span id="net" class="none"></span></div>
<div id="st" role="status" aria-live="polite"></div>
<div id="app"></div></main>
<nav class="tabs" role="tablist" aria-label="Sections"></nav>
<script>
const SEC=["Meat","Produce","Dairy & deli","Breads","Dry goods & canned","Spices","Snacks"];
const STARTER=[{name:"Taco night",ing:[["ground beef","Meat"],["tortillas","Breads"],["shredded cheese","Dairy & deli"],["lettuce","Produce"],["taco seasoning","Spices"]]},
{name:"Spaghetti & meatballs",ing:[["spaghetti","Dry goods & canned"],["marinara sauce","Dry goods & canned"],["ground beef","Meat"],["parmesan","Dairy & deli"]]},
{name:"Chicken stir-fry",ing:[["chicken breast","Meat"],["broccoli","Produce"],["rice","Dry goods & canned"],["soy sauce","Dry goods & canned"]]},
{name:"Breakfast for dinner",ing:[["eggs","Dairy & deli"],["bacon","Meat"],["pancake mix","Dry goods & canned"],["strawberries","Produce"]]},
{name:"Baked salmon",ing:[["salmon fillets","Meat"],["asparagus","Produce"],["lemon","Produce"],["garlic powder","Spices"]]}];
const FIXED=[["sandwich bread","Breads","lunch"],["sliced turkey","Dairy & deli","lunch"],["grapes","Produce","lunch"],["other fruit","Produce","lunch"],["apples","Produce","lunch"],["a crunchy snack","Snacks","lunch"],
["cheese cubes","Dairy & deli","after-school board"],["crackers","Snacks","after-school board"],["salami","Meat","after-school board"],["baby carrots","Produce","after-school board"],["hummus","Dairy & deli","after-school board"],["small sweet treat (nut-free)","Snacks","after-school board"]];
const DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $=(s)=>document.querySelector(s),esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db=null,sample=null,tab="d",sel=null,confirm=null,tmr=null,lastpantry="";
let S={lib:null,pantry:[],hist:[],weeks:{},ptr:null};
try{Object.assign(S,JSON.parse(localStorage.getItem("cb")||"{}"))}catch(e){}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const monday=d=>{d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const fromKey=k=>new Date(k+"T12:00:00");
const addWeek=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+7*n);return iso(d)};
if(!S.ptr)S.ptr={key:iso(monday(new Date())),t:0};
const blank=()=>({sel:Array(7).fill(0),locked:false,din:Array(7).fill(""),dl:Array(7).fill(0),chk:{},extras:[],saved:false,t:0});
const W=()=>S.weeks[S.ptr.key]||(S.weeks[S.ptr.key]=blank());
const LIB=()=>S.lib?S.lib:STARTER;
const say=m=>{$("#st").textContent=m;clearTimeout(say.t);say.t=setTimeout(()=>$("#st").textContent="",5000)};
function cache(){try{localStorage.setItem("cb",JSON.stringify(S))}catch(e){}}
async function push(path,data){data.t=Date.now();cache();if(!db)return;try{await db.doc(path).set(data)}catch(e){say("Offline: saved on this device, will sync when back online.");S.dirty=1}}
const saveWeek=()=>{const w=W();push("weeks/"+S.ptr.key,w)};
const savePtr=()=>{S.ptr.t=Date.now();push("meta/ptr",S.ptr)};
function pickDinner(w,i){const used=new Set(w.din.filter((x,j)=>x&&j!==i)),rec=new Set(S.hist.slice(-8));
 const L=LIB().map(d=>d.name);let c=L.filter(n=>!used.has(n)&&!rec.has(n));if(!c.length)c=L.filter(n=>!used.has(n));if(!c.length)c=L;return c.length?c[Math.floor(Math.random()*c.length)]:""}
function lockToggle(){const w=W();if(w.locked){w.locked=false;say("Days unlocked. Change days, then lock again.")}else{
 if(!w.sel.some(Boolean)){say("Check at least one day first.");return}
 w.sel.forEach((s,i)=>{if(!s){w.din[i]="";w.dl[i]=0}else if(!w.din[i])w.din[i]=pickDinner(w,i)});w.locked=true;say("Days locked and dinners picked.")}
 saveWeek();render()}
function refresh(){const w=W();if(!w.locked){say("Lock days first.");return}
 if(w.saved&&confirm!=="r"){confirm="r";say("This week is saved. Tap Refresh again within 5 seconds to confirm; it clears the saved list.");clearTimeout(tmr);tmr=setTimeout(()=>{confirm=null;render()},5000);render();return}
 confirm=null;if(w.saved){w.saved=false;w.chk={}}
 w.sel.forEach((s,i)=>{if(s&&!w.dl[i])w.din[i]="";});w.sel.forEach((s,i)=>{if(s&&!w.dl[i])w.din[i]=pickDinner(w,i)});saveWeek();say("Dinners refreshed.");render()}
function saveBtn(){const w=W();w.saved=true;w.din.forEach(n=>n&&S.hist.push(n));S.hist=S.hist.slice(-30);saveWeek();push("meta/hist",{h:S.hist});say("Week saved.");render()}
function newWeek(){if(confirm!=="n"){confirm="n";say("Tap Start new week again to clear this week and move to the next.");clearTimeout(tmr);tmr=setTimeout(()=>{confirm=null;render()},5000);render();return}
 confirm=null;S.weeks[S.ptr.key]=blank();saveWeek();S.ptr.key=addWeek(S.ptr.key,1);savePtr();say("New week started.");render()}
function nav(n){S.ptr.key=addWeek(S.ptr.key,n);savePtr();sel=null;render()}
function swap(a,b){const w=W();if(a===b)return;[w.din[a],w.din[b]]=[w.din[b],w.din[a]];[w.dl[a],w.dl[b]]=[w.dl[b],w.dl[a]];[w.sel[a],w.sel[b]]=[w.sel[b],w.sel[a]];sel=null;saveWeek();say("Swapped "+DN[a]+" and "+DN[b]+".");render()}
function tapDay(i){const w=W();if(sel===null){if(!w.din[i])return;sel=i;say("Now tap the day to swap with "+DN[i]+".");render()}else if(sel===i){sel=null;render()}else swap(sel,i)}
function label(){const a=fromKey(S.ptr.key),b=new Date(a);b.setDate(b.getDate()+6);const f=d=>MN[d.getMonth()]+" "+d.getDate();return "Week of "+f(a)+" – "+f(b)}
function dinnersView(){const w=W(),mon=fromKey(S.ptr.key),today=iso(new Date());
 let h=`<div class="bar"><button class="p" data-a="save">${w.saved?"Saved ✓":"Save"}</button><button data-a="refresh">${confirm==="r"?"Tap again to confirm":"Refresh"}</button><button data-a="newweek" class="${confirm==="n"?"d":""}">${confirm==="n"?"Tap again to confirm":"Start new week"}</button></div>
<div class="bar" style="justify-content:center;margin-top:8px"><button data-a="prev" aria-label="Previous week">‹</button><strong>${label()}</strong><button data-a="next" aria-label="Next week">›</button></div>
<h2>Plan the week</h2><div class="card"><div class="bar" role="group" aria-label="Days to plan">`;
 DN.forEach((d,i)=>h+=`<label class="chk"><input type="checkbox" data-sel="${i}" ${w.sel[i]?"checked":""} ${w.locked?"disabled":""}>${d}</label>`);
 h+=`</div><button class="${w.locked?"":"p"}" data-a="lock" style="margin-top:6px">${w.locked?"Unlock days":"Lock days"}</button></div><h2>This week</h2>`;
 DN.forEach((d,i)=>{const dt=new Date(mon);dt.setDate(dt.getDate()+i);const nm=w.din[i];
  h+=`<div class="day ${iso(dt)===today?"today":""} ${sel===i?"pick":""}" data-drop="${i}">`+
  (nm?`<span class="h" draggable="true" data-drag="${i}" aria-hidden="true">⠿</span>`:`<span style="width:1rem"></span>`)+
  `<button class="n" style="border:0;background:none;text-align:left;flex:1" data-day="${i}" aria-label="${d} ${dt.getDate()}: ${nm||"No dinner planned"}${nm?". Tap to swap":""}"><b>${d}</b> ${MN[dt.getMonth()]} ${dt.getDate()} · <span class="${nm?"":"none"}">${nm?esc(nm):"No dinner planned"}</span></button>`+
  (nm?`<button data-dl="${i}" aria-pressed="${!!w.dl[i]}" aria-label="${w.dl[i]?"Unlock":"Lock"} ${d} dinner">${w.dl[i]?"🔒":"🔓"}</button>`:"")+`</div>`});
 return h}
function items(){const w=W(),pan=new Set(S.pantry.map(p=>p.name.toLowerCase())),m={};
 const add=(n,s,t)=>{const k=n.toLowerCase();if(pan.has(k))return;(m[k]=m[k]||{n,s,tags:[]}).tags.includes(t)||m[k].tags.push(t)};
 if(w.locked)w.din.forEach(nm=>{const d=LIB().find(x=>x.name===nm);d&&d.ing.forEach(([n,s])=>add(n,s,nm))});
 FIXED.forEach(([n,s,t])=>add(n,s,t));w.extras.forEach(e=>(m[e.n.toLowerCase()]={n:e.n,s:e.s,tags:[],x:1}));return Object.values(m)}
function shopView(){const w=W(),L=items(),done=L.filter(i=>w.chk[i.n.toLowerCase()]).length;
 let h=`<h2>Shopping list</h2><progress value="${done}" max="${L.length}" aria-label="Items checked"></progress><div class="none">${done} of ${L.length} checked</div>`;
 if(!w.locked)h+=`<p class="none">Lock your days on the Dinners tab to add dinner ingredients.</p>`;
 SEC.forEach(s=>{const g=L.filter(i=>i.s===s);if(!g.length)return;h+=`<h2>${s}</h2><div class="card">`;
  g.forEach(i=>{const k=i.n.toLowerCase();h+=`<div class="it ${w.chk[k]?"dn":""}"><input type="checkbox" id="c_${esc(k)}" data-chk="${esc(k)}" ${w.chk[k]?"checked":""}><label for="c_${esc(k)}" style="flex:1"><span>${esc(i.n)}</span>${i.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</label>${i.x?`<button data-rx="${esc(k)}" aria-label="Remove ${esc(i.n)}">✕</button>`:""}</div>`});h+=`</div>`});
 h+=`<h2>Add an extra item</h2><div class="bar"><input type="text" id="xn" aria-label="Extra item name" placeholder="Item"><select id="xs" aria-label="Section" style="width:auto">${SEC.map(s=>`<option>${s}</option>`).join("")}</select><button class="p" data-a="addx">Add</button></div>`;return h}
function pantryView(){let h=`<h2>Pantry</h2><div class="card"><label for="pt"><strong>Type items</strong> (one per line or comma-separated)</label><textarea id="pt" rows="3"></textarea>
<div class="bar"><select id="ps" aria-label="Section" style="width:auto"><option value="">Auto-sort with AI</option>${SEC.map(s=>`<option>${s}</option>`).join("")}</select><button class="p" data-a="padd">Add</button>
<label class="chk" style="border:1px solid var(--bd);border-radius:10px;cursor:pointer">📷 Photo<input type="file" id="ph" accept="image/*" style="position:absolute;opacity:0;width:1px;height:1px"></label></div></div>
<p class="none">Tap an item when it’s used up to send it to the shopping list.</p>`;
 SEC.forEach(s=>{const g=S.pantry.filter(p=>p.section===s);if(!g.length)return;h+=`<h2>${s}</h2><div class="card">`;g.forEach(p=>h+=`<div class="it"><button style="flex:1;text-align:left;border:0;background:none" data-used="${esc(p.id)}" aria-label="${esc(p.name)} used up, move to shopping list">${esc(p.name)}</button></div>`);h+=`</div>`});return h}
function libView(){return `<h2>Dinner library (${LIB().length})</h2><div class="card">${LIB().map(d=>`<div class="it"><span style="flex:1"><b>${esc(d.name)}</b><br><small class="none">${d.ing.map(i=>esc(i[0])).join(", ")}</small></span></div>`).join("")}</div>
<h2>Import dinners</h2><div class="card"><label for="im">One dinner per line: <code>Name | ingredient:Section, ingredient:Section</code> (sections: ${SEC.join(", ")}). Unmarked ingredients go to Dry goods &amp; canned.</label><textarea id="im" rows="6"></textarea>
<div class="bar"><button class="p" data-a="imp">Add to library</button><button data-a="imrep">Replace library</button><label class="chk" style="border:1px solid var(--bd);border-radius:10px;cursor:pointer">Upload .txt<input type="file" id="imf" accept=".txt,.csv" style="position:absolute;opacity:0;width:1px;height:1px"></label></div></div>`}
let draft=[];
const secOf=s=>SEC.find(x=>x.toLowerCase()===String(s||"").trim().toLowerCase())||"";
const RP=`Extract every dinner recipe. Return only a JSON array of {"name","ingredients":[{"name","section"}]}, where section is one of: ${SEC.join(", ")}. Use short grocery-style ingredient names with no quantities.`;
async function fillSections(ds){const miss=[...new Set(ds.flatMap(d=>d.ing.filter(i=>!i[1]).map(i=>i[0])))];
 if(miss.length){const r=await ask(`Assign each grocery item to one section from: ${SEC.join(", ")}. Return only a JSON array of {"name","section"}. Items: ${JSON.stringify(miss)}`);const m={};(Array.isArray(r)?r:[]).forEach(x=>m[String(x.name).toLowerCase()]=secOf(x.section));
  ds.forEach(d=>d.ing.forEach(i=>{if(!i[1])i[1]=m[i[0].toLowerCase()]||"Dry goods & canned"}))}
 return ds}
function fromAI(r){return(Array.isArray(r)?r:[]).map(d=>({name:String(d.name||"").trim(),ing:(d.ingredients||[]).map(i=>[String(i.name||i).trim(),secOf(i.section)]).filter(i=>i[0])})).filter(d=>d.name&&d.ing.length)}
function fromSheet(rows){rows=rows.filter(r=>r.some(c=>String(c).trim()));if(!rows.length)return[];
 const h=rows[0].map(c=>String(c).toLowerCase()),ci=re=>h.findIndex(x=>re.test(x));let n=ci(/dinner|recipe|name|meal/),g=ci(/ingredient/),s=ci(/section|categor|aisle/),body=rows;
 if(n>=0&&g>=0)body=rows.slice(1);else{n=0;g=1;s=2}
 let last="";const m=new Map();
 body.forEach(r=>{const nm=String(r[n]||"").trim()||last;if(!nm)return;last=nm;if(!m.has(nm))m.set(nm,[]);
  String(r[g]||"").split(/[,;\n]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const[a,b]=x.split(":");m.get(nm).push([a.trim(),secOf(b)||secOf(r[s])])})});
 return[...m].map(([name,ing])=>({name,ing})).filter(d=>d.ing.length)}
function setDraft(ds){draft=ds;say(ds.length?ds.length+" dinner(s) found. Review them, then add to the library.":"No recipes found.");render()}
const hid="position:absolute;opacity:0;width:1px;height:1px",pick="border:1px solid var(--bd);border-radius:10px;cursor:pointer";
function recipesView(){let h=recipeList()+`<h2>Add recipes</h2>
<div class="card"><strong>Spreadsheet</strong><p class="none">Excel or CSV. Use columns Dinner, Ingredient and Section (one row per ingredient), or Dinner plus a comma-separated Ingredients column. Missing sections are sorted by AI.</p><label class="chk" style="${pick}">📊 Choose spreadsheet<input type="file" id="rx" accept=".xlsx,.xls,.csv" style="${hid}"></label></div>
<div class="card"><label for="rt"><strong>Free text</strong> (paste one or many recipes)</label><textarea id="rt" rows="5"></textarea><div class="bar" style="margin-top:6px"><button class="p" data-a="rtext">Read with AI</button></div></div>
<div class="card"><strong>Photo</strong><p class="none">Snap a cookbook page, recipe card or screenshot. You can choose several.</p><label class="chk" style="${pick}">📷 Choose photos<input type="file" id="rph" accept="image/*" multiple style="${hid}"></label></div>`;
 if(draft.length){h+=`<h2>Review (${draft.length})</h2>`;draft.forEach((d,i)=>h+=`<div class="card"><div class="bar"><b class="sp">${esc(d.name)}</b><button data-rd="${i}" aria-label="Remove ${esc(d.name)}">✕</button></div><small class="none">${d.ing.map(x=>esc(x[0])+" ("+esc(x[1])+")").join(", ")}</small></div>`);
  h+=`<div class="bar"><button class="p" data-a="radd">Add ${draft.length} to library</button><button data-a="rclear">Discard</button></div>`}
 return h}
let ed=null;
const ingText=d=>d.ing.map(i=>i[0]+": "+i[1]).join("\n");
function parseIng(t){return t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const k=l.lastIndexOf(":"),s=k>0?secOf(l.slice(k+1)):"";return s?[l.slice(0,k).trim(),s]:[l,"Dry goods & canned"]})}
function editor(){return `<div class="card" style="border-color:var(--ac)"><label for="en"><strong>Recipe name</strong></label><input type="text" id="en" value="${esc(ed.name)}"><label for="et" style="display:block;margin-top:8px"><strong>Ingredients</strong> <span class="none">(one per line, as “ingredient: Section”)</span></label><textarea id="et" rows="8">${esc(ed.text)}</textarea><p class="none" style="margin:4px 0">Sections: ${SEC.join(", ")}</p><div class="bar"><button class="p" data-a="rsave">Save recipe</button><button data-a="rcancel">Cancel</button></div></div>`}
function recipeList(){const L=LIB(),mon=fromKey(S.ptr.key);
 const opts=DN.map((d,i)=>{const dt=new Date(mon);dt.setDate(dt.getDate()+i);return `<option value="${i}">${d} ${MN[dt.getMonth()]} ${dt.getDate()}</option>`}).join("");

 if(ed&&ed.i<0)h+=editor();

 L.forEach((d,i)=>{if(ed&&ed.i===i){h+=editor();return}

 return h}
const TYPES=["PB","PFB","House","Health","Oliver","Ansel","General","Class"],PN={1:"High",2:"Medium",3:"Low"},BK=["Overdue","Today","Tomorrow","This week","Later","No date"];
let tg="date",tfp=0,tft="",tsd=false,ted=null;S.tasks=S.tasks||[];
const T0=()=>iso(new Date()),addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmtD=d=>d?new Date(d+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):"No date";
const bucket=d=>{const t=T0();if(!d)return"No date";if(d<t)return"Overdue";if(d===t)return"Today";if(d===addD(1))return"Tomorrow";if(d<=addD(7))return"This week";return"Later"};
const sortT=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||a.pri-b.pri;
function taskUpsert(t){const i=S.tasks.findIndex(x=>x.id===t.id);if(i<0)S.tasks.push(t);else S.tasks[i]=t;cache();if(db){const{id,...r}=t;db.doc("tasks/"+id).set(r).catch(()=>say("Couldn’t save that task. You may have view-only access."))}render()}
function taskDel(id){S.tasks=S.tasks.filter(x=>x.id!==id);cache();if(db)db.doc("tasks/"+id).delete().catch(()=>say("Couldn’t delete that task."));render()}
const opt=(a,v)=>a.map(([k,l])=>`<option value="${k}"${String(k)===String(v)?" selected":""}>${l}</option>`).join(""),tyo=v=>opt(TYPES.map(x=>[x,x]),v),pro=v=>opt([[1,"High"],[2,"Medium"],[3,"Low"]],v);
function tRow(t){return `<div class="tk p${t.pri}${t.done?" done":""}"><input type="checkbox" data-tdone="${t.id}" ${t.done?"checked":""} aria-label="Done: ${esc(t.title)}"><div style="flex:1"><span class="tt">${esc(t.title)}</span><br><small class="none">${t.type} · ${PN[t.pri]} · ${fmtD(t.date)}</small></div><button data-a="tedit" data-id="${t.id}" aria-label="Edit ${esc(t.title)}">Edit</button><button data-a="tdel" data-id="${t.id}" aria-label="Delete ${esc(t.title)}">✕</button></div>`}
function tEdit(t){return `<div class="card" style="border-color:var(--ac)"><label for="etn"><strong>Task</strong></label><input type="text" id="etn" value="${esc(t.title)}"><div class="bar" style="margin-top:6px"><input type="date" id="etd" value="${t.date||""}" aria-label="Due date" style="width:auto"><select id="ett" aria-label="Type" style="width:auto">${tyo(t.type)}</select><select id="etp" aria-label="Priority" style="width:auto">${pro(t.pri)}</select></div><div class="bar" style="margin-top:6px"><button class="p" data-a="tsave" data-id="${t.id}">Save</button><button data-a="tcancel">Cancel</button></div></div>`}
function tasksView(){const t0=T0(),open=S.tasks.filter(t=>!t.done),od=open.filter(t=>t.date&&t.date<t0).length,td=open.filter(t=>t.date===t0).length,hi=open.filter(t=>t.pri===1).length;
 let h=`<h2>Tasks</h2><div class="ts"><div class="st"><b style="color:#d6402f">${od}</b><span>Overdue</span></div><div class="st"><b>${td}</b><span>Due today</span></div><div class="st"><b>${hi}</b><span>High priority open</span></div><div class="st"><b>${S.tasks.filter(t=>t.done).length}/${S.tasks.length}</b><span>Done</span></div></div>
<div class="card"><label for="tn"><strong>Add a task</strong></label><input type="text" id="tn" placeholder="Task"><div class="bar" style="margin-top:6px"><input type="date" id="td" aria-label="Due date" style="width:auto"><select id="ty" aria-label="Type" style="width:auto">${tyo("General")}</select><select id="tp" aria-label="Priority" style="width:auto">${pro(2)}</select><button class="p" data-a="tadd">Add task</button></div></div>`;
 let wk="";for(let i=0;i<7;i++){const d=addD(i),n=open.filter(t=>t.date===d||(i===0&&t.date&&t.date<t0)).length;wk+=`<div><b>${n}</b>${i?new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short"}):"Today"}</div>`}
 const fo=[...open].sort((a,b)=>{const s=t=>(t.date&&t.date<=t0?0:1)*10+t.pri;return s(a)-s(b)||sortT(a,b)}).slice(0,5);
 h+=`<div class="card"><strong>Next 7 days</strong><div class="wk" style="margin-top:6px">${wk}</div></div><div class="card"><strong>Focus now</strong>${fo.length?fo.map(t=>`<div class="it"><span class="tag">${PN[t.pri]}</span><span style="flex:1">${esc(t.title)}</span><span class="none">${t.date&&t.date<t0?"Overdue":fmtD(t.date)}</span></div>`).join(""):'<p class="none">Nothing open. Nice.</p>'}</div>`;
 const mx=Math.max(1,...TYPES.map(y=>open.filter(t=>t.type===y).length));
 h+=`<div class="card"><strong>Open by type</strong>${TYPES.map(y=>{const n=open.filter(t=>t.type===y).length;return`<div class="tb"><span>${y}</span><div class="tr"><i style="width:${n/mx*100}%"></i></div><span>${n}</span></div>`}).join("")}</div>
<h2>All tasks</h2><div class="bar"><button data-a="tg" data-g="date" aria-pressed="${tg==="date"}" class="${tg==="date"?"p":""}">By date</button><button data-a="tg" data-g="type" aria-pressed="${tg==="type"}" class="${tg==="type"?"p":""}">By type</button><select id="tfp" aria-label="Filter priority" style="width:auto">${opt([[0,"All priorities"],[1,"High"],[2,"Medium"],[3,"Low"]],tfp)}</select><select id="tft" aria-label="Filter type" style="width:auto">${opt([["","All types"]].concat(TYPES.map(x=>[x,x])),tft)}</select><label class="chk"><input type="checkbox" id="tsd" ${tsd?"checked":""}>Show done</label></div>`;
 const L=S.tasks.filter(t=>(tsd||!t.done)&&(!tfp||t.pri===tfp)&&(!tft||t.type===tft)).sort(sortT),keys=tg==="date"?BK:TYPES,key=t=>tg==="date"?bucket(t.date):t.type;
 keys.forEach(k=>{const g=L.filter(t=>key(t)===k);if(!g.length)return;h+=`<h3 style="margin:12px 0 2px;font-size:1rem;${k==="Overdue"?"color:#d6402f":""}">${k} <span class="none">${g.length}</span></h3>`+g.map(t=>ted===t.id?tEdit(t):tRow(t)).join("")});
 if(!L.length)h+=`<p class="none">No tasks match. Add one above.</p>`;
 return h}
function render(){const a=document.activeElement&&document.activeElement.id;
 $("#app").innerHTML=tab==="d"?dinnersView():tab==="s"?shopView():tab==="p"?pantryView():tab==="t"?tasksView():recipesView();
 $(".tabs").innerHTML=[["d","Dinners"],["s","Shopping"],["p","Pantry"],["r","Recipes"],["t","Tasks"]].map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${n}</button>`).join("");
 $("#net").textContent=navigator.onLine?"":"Offline";if(a){const e=document.getElementById(a);e&&e.focus()}}
const id=()=>Math.random().toString(36).slice(2,9);
function parseLines(t){return t.split(/[\n,]/).map(s=>s.trim()).filter(Boolean)}
function addPantry(names,sec){names.forEach(n=>{if(!S.pantry.some(p=>p.name.toLowerCase()===n.name.toLowerCase()))S.pantry.push({id:id(),name:n.name,section:SEC.includes(n.section)?n.section:"Dry goods & canned"})});push("pantry/main",{items:S.pantry});render()}
async function ask(p,imgs){if(!sample){say("AI isn’t available here; pick a section instead.");return null}try{return await sample.json(p,imgs?{images:imgs}:{})}catch(e){say("AI request failed.");return null}}
function parseImport(t){return t.split("\n").map(l=>l.trim()).filter(l=>l.includes("|")).map(l=>{const[n,r]=l.split("|");return{name:n.trim(),ing:r.split(",").map(x=>x.trim()).filter(Boolean).map(x=>{const[a,b]=x.split(":");return[a.trim(),SEC.find(s=>s.toLowerCase()===(b||"").trim().toLowerCase())||"Dry goods & canned"]})}}).filter(d=>d.name&&d.ing.length)}
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
 if(D.tab){tab=D.tab;render();return}
 if(D.day!==undefined)return tapDay(+D.day);
 if(D.dl!==undefined){const w=W(),i=+D.dl;w.dl[i]=w.dl[i]?0:1;saveWeek();say(DN[i]+(w.dl[i]?" dinner locked.":" dinner unlocked."));return render()}
 if(D.used){const p=S.pantry.find(x=>x.id===D.used);S.pantry=S.pantry.filter(x=>x.id!==D.used);W().extras.push({n:p.name,s:p.section});push("pantry/main",{items:S.pantry});saveWeek();say(p.name+" moved to shopping list.");return render()}
 if(D.rd!==undefined){draft.splice(+D.rd,1);return render()}
 if(D.rx){const w=W();w.extras=w.extras.filter(x=>x.n.toLowerCase()!==D.rx);saveWeek();return render()}
 switch(D.a){case"tadd":{const title=$("#tn").value.trim();if(!title)return say("Type a task first.");taskUpsert({id:"t"+Date.now(),title,date:$("#td").value,type:$("#ty").value,pri:+$("#tp").value,done:false});say("Task added.");$("#tn").focus();return}
 case"tedit":ted=D.id;render();$("#etn")&&$("#etn").focus();return;
 case"tcancel":ted=null;return render();
 case"tsave":{const t=S.tasks.find(x=>x.id===D.id),title=$("#etn").value.trim();if(!t||!title)return;ted=null;return taskUpsert({...t,title,date:$("#etd").value,type:$("#ett").value,pri:+$("#etp").value})}
 case"tdel":return taskDel(D.id);
 case"tg":tg=D.g;return render();
 case"rnew":ed={i:-1,name:"",text:""};render();$("#en")&&$("#en").focus();return;
 case"redit":{const d=LIB()[+D.i];ed={i:+D.i,name:d.name,text:ingText(d)};render();$("#en")&&$("#en").focus();return}
 case"rcancel":ed=null;return render();
 case"rsave":{const name=$("#en").value.trim(),ing=parseIng($("#et").value);if(!name||!ing.length)return say("Add a name and at least one ingredient.");
  const L=LIB().slice(),old=ed.i>=0?L[ed.i].name:null;
  if(L.some((x,j)=>x.name.toLowerCase()===name.toLowerCase()&&j!==ed.i))return say("A recipe with that name already exists.");
  if(ed.i>=0)L[ed.i]={name,ing};else L.push({name,ing});
  S.lib=L;push("library/main",{dinners:L});
  if(old&&old!==name)Object.keys(S.weeks).forEach(k=>{const w=S.weeks[k];if(w.din.includes(old)){w.din=w.din.map(x=>x===old?name:x);push("weeks/"+k,w)}});
  ed=null;say("Recipe saved.");return render()}
 case"rdel":{const i=+D.i;if(confirm!=="d"+i){confirm="d"+i;say("Tap Delete again to remove this recipe.");clearTimeout(tmr);tmr=setTimeout(()=>{confirm=null;render()},5000);return render()}
  confirm=null;const L=LIB().slice(),[r]=L.splice(i,1);S.lib=L;push("library/main",{dinners:L});say(r.name+" deleted.");return render()}
 case"rasg":{const i=+D.i,day=+$("#as"+i).value,w=W(),nm=LIB()[i].name;w.sel[day]=1;w.din[day]=nm;w.dl[day]=1;saveWeek();say(nm+" assigned to "+DN[day]+". It’s locked, so Refresh won’t change it.");return render()}
 case"rtext":{const t=$("#rt").value.trim();if(!t)return say("Paste a recipe first.");say("Reading recipes with AI…");const r=await ask(RP+"\nRecipes:\n"+t);if(r)setDraft(fromAI(r));return}
 case"radd":{const names=new Set(draft.map(d=>d.name));S.lib=LIB().filter(x=>!names.has(x.name)).concat(draft);push("library/main",{dinners:S.lib});say(draft.length+" dinner(s) added to the library.");draft=[];return render()}
 case"rclear":draft=[];return render();
 case"save":return saveBtn();case"refresh":return refresh();case"newweek":return newWeek();case"prev":return nav(-1);case"next":return nav(1);case"lock":return lockToggle();
 case"addx":{const n=$("#xn").value.trim();if(!n)return;W().extras.push({n,s:$("#xs").value});saveWeek();say(n+" added.");return render()}
 case"padd":{const names=parseLines($("#pt").value);if(!names.length)return;const sec=$("#ps").value;if(sec)return addPantry(names.map(name=>({name,section:sec})));
  say("Sorting with AI…");const r=await ask(`Assign each grocery item to exactly one section from: ${SEC.join(", ")}. Return only a JSON array of {"name","section"}. Items: ${JSON.stringify(names)}`);if(r)addPantry(r),say("Items sorted and added.");return}
 case"imp":case"imrep":{const d=parseImport($("#im").value);if(!d.length)return say("No dinners found. Use: Name | ingredient:Section, …");S.lib=t.dataset.a==="imp"?LIB().filter(x=>!d.some(y=>y.name===x.name)).concat(d):d;push("library/main",{dinners:S.lib});say(d.length+" dinner(s) imported.");return render()}}});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.dataset.tdone){const k=S.tasks.find(x=>x.id===t.dataset.tdone);if(k)taskUpsert({...k,done:t.checked});return}
 if(t.id==="tfp"){tfp=+t.value;return render()}
 if(t.id==="tft"){tft=t.value;return render()}
 if(t.id==="tsd"){tsd=t.checked;return render()}
 if(t.dataset.sel!==undefined){const w=W();if(w.locked)return;w.sel[+t.dataset.sel]=t.checked?1:0;saveWeek()}
 else if(t.dataset.chk){W().chk[t.dataset.chk]=t.checked;saveWeek();render()}
 else if(t.id==="rx"&&t.files[0]){say("Reading spreadsheet…");try{const wb=XLSX.read(await t.files[0].arrayBuffer(),{type:"array"});let ds=[];wb.SheetNames.forEach(n=>{ds=ds.concat(fromSheet(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""})))});setDraft(await fillSections(ds))}catch(x){say("Couldn’t read that spreadsheet.")}}
 else if(t.id==="rph"&&t.files.length){const fs=[...t.files];let l=null;try{l=await sample.limits()}catch(x){}if(!sample||!l||!l.images)return say("Photo reading isn’t available here.");say("Reading photos with AI…");const r=await ask(RP+" Read the recipe(s) in these photos.",fs);if(r)setDraft(fromAI(r))}
 else if(t.id==="imf"&&t.files[0]){$("#im").value=await t.files[0].text();say("File loaded. Review, then add.")}
 else if(t.id==="ph"&&t.files[0]){say("Reading photo with AI…");let l=null;try{l=await sample.limits()}catch(x){}
  if(!sample||!l||!l.images)return say("Photo reading isn’t available here.");
  const r=await ask(`List the food and grocery items visible in this photo. Return only a JSON array of {"name","section"} with section one of: ${SEC.join(", ")}.`,[t.files[0]]);if(r){addPantry(r);say(r.length+" items added from photo.")}}});
let dragI=null;document.addEventListener("dragstart",e=>{const h=e.target.closest("[data-drag]");if(h){dragI=+h.dataset.drag;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","x")}});
document.addEventListener("dragover",e=>{if(dragI!==null&&e.target.closest("[data-drop]"))e.preventDefault()});
document.addEventListener("drop",e=>{const r=e.target.closest("[data-drop]");if(r&&dragI!==null){e.preventDefault();swap(dragI,+r.dataset.drop)}dragI=null});
addEventListener("online",()=>{render();if(S.dirty){S.dirty=0;saveWeek();savePtr();push("pantry/main",{items:S.pantry})}});addEventListener("offline",render);
function newer(path,d,cur){return d&&(d.t||0)>(cur||0)}
async function boot(){render();
 try{sample=await claude.use("sample")}catch(e){}
 try{db=await claude.use("db")}catch(e){}
 if(!db)return say("Cloud sync unavailable; working offline on this device.");
 const err=()=>say("Sync problem; working from local copy.");
 db.doc("meta/ptr").onSnapshot(s=>{const d=s.exists&&s.data();if(d&&d.t>(S.ptr.t||0)){S.ptr={key:d.key,t:d.t};sel=null;cache();render()}},err);
 db.collection("weeks").onSnapshot(s=>{s.docs.forEach(x=>{const d=x.data(),c=S.weeks[x.id];if(d&&(!c||(d.t||0)>(c.t||0)))S.weeks[x.id]=Object.assign(blank(),d)});cache();render()},err);
 db.doc("library/main").onSnapshot(s=>{const d=s.exists&&s.data();if(d&&d.dinners){S.lib=d.dinners;cache();render()}},err);
 db.doc("pantry/main").onSnapshot(s=>{const d=s.exists&&s.data();if(d&&d.items){S.pantry=d.items;cache();if(tab!=="p"||document.activeElement.tagName!=="TEXTAREA")render()}},err);
 db.collection("tasks").onSnapshot(s=>{S.tasks=s.docs.map(d=>({...d.data(),id:d.id}));cache();render()},err);
 db.doc("meta/hist").onSnapshot(s=>{const d=s.exists&&s.data();if(d&&d.h)S.hist=d.h;cache()},err);
 if(S.dirty){S.dirty=0;saveWeek();savePtr()}}
boot();
</script></body></html>
